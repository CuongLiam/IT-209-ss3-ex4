# Server Block for Beta App (Port 8080)
server {
    listen 8080;
    listen [::]:8080;

    root /var/www/beta-app/html;
    index index.html index.htm;

    server_name _;

    location / {
        try_files $uri $uri/ =404;
    }
}

# Server Block for Internal App (Port 8090)
server {
    listen 8090;
    listen [::]:8090;

    root /var/www/internal-app/html;
    index index.html index.htm;

    server_name _;

    location / {
        try_files $uri $uri/ =404;
    }
}
